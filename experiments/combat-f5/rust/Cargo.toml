[workspace]
members = ["core", "sim", "wasm"]
# The wasm crate imports its clock from JS: build it with tools/build.mjs (--target wasm32-unknown-unknown --profile wasm).
default-members = ["core", "sim"]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.wasm]
# opt-level 3: "s" is under 400 KB but searches 1.7x slower; gzip serves 162 KB anyway.
inherits = "release"
strip = true
