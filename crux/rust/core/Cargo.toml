[package]
name = "crux-core"
version = "0.1.0"
edition = "2021"
description = "Crux: the rules, the bots and the engine (the single implementation, native and WebAssembly)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
flate2 = "1"
