<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680">
  <!-- The capital (map id `city`, new maps 2026-11-10): the river runs from the uptown towers through midtown's bridges
       down to Port Calder's docks and the sea. Markers are drawn on top by src/map.js from @place map: positions. -->
  <defs>
    <radialGradient id="kbg" cx="45%" cy="40%" r="80%"><stop offset="0" stop-color="#232741"/><stop offset="1" stop-color="#0e101c"/></radialGradient>
    <linearGradient id="kland" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#36343a"/><stop offset="1" stop-color="#26252b"/></linearGradient>
    <linearGradient id="ksea" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d3b58"/><stop offset="1" stop-color="#11263c"/></linearGradient>
    <filter id="kglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="960" height="680" fill="url(#kbg)"/>
  <!-- the land, and the sea in the south-east corner -->
  <path d="M40 60 L920 50 L925 420 C880 470 820 520 760 560 C700 600 640 640 600 670 L40 670 Z" fill="url(#kland)" stroke="#4a4752" stroke-width="2"/>
  <path d="M925 420 C880 470 820 520 760 560 C700 600 640 640 600 670 L960 680 L960 400 Z" fill="url(#ksea)"/>
  <g fill="none" stroke="#7fa8cf" stroke-opacity=".25" stroke-width="1.5"><path d="M840 560 q16 -6 32 0 M780 620 q16 -6 32 0 M880 620 q14 -5 28 0 M900 500 q12 -5 24 0"/></g>
  <!-- the river, towers to sea -->
  <path d="M70 70 C150 160 210 230 260 300 C320 380 420 420 520 450 C620 480 690 520 760 565" fill="none" stroke="#335f86" stroke-width="16" stroke-opacity=".8" stroke-linecap="round"/>
  <path d="M70 70 C150 160 210 230 260 300 C320 380 420 420 520 450 C620 480 690 520 760 565" fill="none" stroke="#86b4dc" stroke-width="2" stroke-opacity=".25"/>
  <!-- bridges -->
  <g stroke="#a39782" stroke-width="5" stroke-linecap="round"><path d="M215 255 L265 225 M330 380 L360 330 M470 455 L490 405"/></g>
  <!-- uptown: towers and the Crescent -->
  <g fill="#4a4660" stroke="#6e6a8a"><rect x="100" y="80" width="14" height="50"/><rect x="122" y="66" width="12" height="64"/><rect x="142" y="86" width="14" height="44"/><path d="M98 80 l9 -14 l9 14 Z M120 66 l8 -16 l8 16 Z M140 86 l9 -13 l9 13 Z"/></g>
  <path d="M360 70 C420 50 520 50 590 80" fill="none" stroke="#6e6a8a" stroke-width="10" stroke-opacity=".6" stroke-linecap="round"/>
  <g fill="#4e4a5e" stroke="#706b84"><rect x="380" y="140" width="80" height="45"/><path d="M376 142 L420 118 L464 142 Z"/><rect x="200" y="125" width="70" height="40"/><path d="M196 127 L235 105 L274 127 Z"/></g>
  <!-- midtown: the bazaar's awnings, the arcade's colonnade, the theatre's dome -->
  <g fill="#5a3d3a" stroke="#7c5650"><path d="M395 315 l20 -12 l20 12 Z M435 315 l20 -12 l20 12 Z M415 345 l20 -12 l20 12 Z M455 345 l20 -12 l20 12 Z"/></g>
  <g fill="none" stroke="#857a68" stroke-width="2"><path d="M250 345 h110 M250 375 h110 M258 345 v30 M276 345 v30 M294 345 v30 M312 345 v30 M330 345 v30 M348 345 v30"/></g>
  <path d="M570 290 a32 32 0 0 1 64 0 Z" fill="#4f4556" stroke="#776a80"/>
  <!-- the Guild works: chimneys by the river -->
  <g fill="#3c3a3a" stroke="#5e5a58"><rect x="150" y="410" width="70" height="40"/><rect x="160" y="380" width="9" height="30"/><rect x="190" y="372" width="9" height="38"/></g>
  <g fill="#9a9aa8" opacity=".12" filter="url(#kglow)"><circle cx="165" cy="360" r="14"/><circle cx="195" cy="350" r="16"/></g>
  <!-- Port Calder: crooked roofs, wharves, warehouses -->
  <g fill="#43393a" stroke="#62534f"><path d="M790 420 l12 -10 l12 10 v16 h-24 Z M818 430 l11 -9 l11 9 v14 h-22 Z M845 418 l12 -10 l12 10 v18 h-24 Z M808 455 l11 -9 l11 9 v14 h-22 Z"/></g>
  <g fill="#3a3533" stroke="#5c524c"><rect x="730" y="600" width="70" height="30"/><rect x="805" y="590" width="55" height="32"/></g>
  <g stroke="#8a7a5e" stroke-width="4" stroke-linecap="round"><path d="M690 540 l40 30 M720 515 l40 30 M650 570 l35 28"/></g>
  <g fill="#c9b07a" opacity=".55"><path d="M700 600 l14 -6 l-2 10 Z M760 650 l14 -6 l-2 10 Z"/></g>
  <!-- the sea caves under the headland -->
  <path d="M880 600 a24 16 0 0 1 48 0" fill="#141820" stroke="#3b4656" stroke-width="2"/>
</svg>
