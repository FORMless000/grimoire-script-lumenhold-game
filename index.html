<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lumenhold Academy</title>
  <link rel="icon" type="image/svg+xml" href="src/icon.svg">
  <meta name="theme-color" content="#0e1124">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/style.css">
  <link rel="stylesheet" href="src/combat.css">
</head>
<body>
  <div id="app"></div>
  <!-- engine (DOM-free) -->
  <script src="src/version.js"></script>
  <script src="src/grimoire.js"></script>
  <script src="src/director.js"></script>
  <script src="src/engine.js"></script>
  <script src="src/art.js"></script>
  <script src="src/i18n.js"></script>
  <script src="src/net.js"></script>
  <script src="src/map.js"></script>
  <script src="src/sky.js"></script>
  <!-- content + translations: generated from content/**/*.grim and locales/**/*.lang by `node tools/grim.js build` -->
  <script src="build/content.bundle.js"></script>
  <!-- The combat minigame (combat/, bundled by combat/tools/bundle.mjs): window.LumenholdCombat -->
  <script src="build/combat.bundle.js"></script>
  <!-- the bridge (DOM-free, shared with the simulated players) and the fight screen over the card -->
  <script src="src/combat.js"></script>
  <script src="src/combat-ui.js"></script>
  <!-- presentation -->
  <script src="src/ui.js"></script>
</body>
</html>
