<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="Georgia, 'Times New Roman', serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Concept mock-up of the location picker (design-v0.3 §5). Not wired to the game. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#1f2a44"/><stop offset="1" stop-color="#0d1222"/>
    </radialGradient>
    <radialGradient id="lake" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#2d5b82"/><stop offset="1" stop-color="#183450"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grass" width="14" height="14" patternUnits="userSpaceOnUse">
      <path d="M2 12 l2-4 M8 6 l2-4" stroke="#3b4d3a" stroke-width="1" fill="none" opacity=".6"/>
    </pattern>
  </defs>

  <rect width="960" height="680" fill="url(#bg)"/>

  <!-- header -->
  <text x="32" y="44" fill="#e8d9a8" font-size="24">Emberwane · Year 2 · Autumn term</text>
  <text x="32" y="70" fill="#9aa6c4" font-size="15" font-style="italic">Where will you spend the afternoon and the evening?</text>
  <g font-size="14">
    <rect x="590" y="26" width="168" height="34" rx="17" fill="#2c3a5e" stroke="#e8c45a" stroke-width="2"/>
    <text x="606" y="48" fill="#f1e3b0">① Afternoon · Duel Hall</text>
    <rect x="768" y="26" width="164" height="34" rx="17" fill="#1a2238" stroke="#5a6788" stroke-dasharray="4 3"/>
    <text x="786" y="48" fill="#9aa6c4">② Evening · choose…</text>
  </g>

  <!-- land masses -->
  <path d="M90 170 C180 110 330 95 480 100 C650 105 800 120 880 190 C920 260 905 420 860 500 C820 580 700 620 560 625 C400 630 230 610 150 540 C80 470 60 260 90 170 Z" fill="#26331f"/>
  <path d="M90 170 C180 110 330 95 480 100 C650 105 800 120 880 190 C920 260 905 420 860 500 C820 580 700 620 560 625 C400 630 230 610 150 540 C80 470 60 260 90 170 Z" fill="url(#grass)"/>

  <!-- lake -->
  <ellipse cx="480" cy="360" rx="235" ry="125" fill="url(#lake)"/>
  <ellipse cx="480" cy="360" rx="235" ry="125" fill="none" stroke="#7fb0d6" stroke-opacity=".35" stroke-width="2"/>
  <path d="M330 350 q20 -6 40 0 M520 400 q20 -6 40 0 M420 420 q14 -5 28 0 M600 330 q16 -5 32 0" stroke="#9cc6e6" stroke-opacity=".35" fill="none"/>
  <text x="430" y="372" fill="#9cc6e6" fill-opacity=".55" font-size="16" font-style="italic">the Mirror Lake</text>

  <!-- barge route -->
  <path d="M560 285 C640 330 700 400 735 480" stroke="#c9b27a" stroke-width="2" stroke-dasharray="6 6" fill="none" opacity=".8"/>
  <text x="648" y="372" fill="#c9b27a" font-size="12" font-style="italic" transform="rotate(48 648 372)">barge</text>

  <!-- castle: seven towers + light bridges -->
  <g>
    <path d="M370 255 L590 255 L590 235 L370 235 Z" fill="#3a3550"/>
    <g fill="#4a4466" stroke="#6d6690" stroke-width="1">
      <rect x="380" y="170" width="22" height="85"/><path d="M378 170 L391 140 L404 170 Z"/>
      <rect x="415" y="185" width="20" height="70"/><path d="M413 185 L425 160 L437 185 Z"/>
      <rect x="448" y="150" width="24" height="105"/><path d="M446 150 L460 115 L474 150 Z"/>
      <rect x="488" y="125" width="26" height="130"/><path d="M486 125 L501 85 L516 125 Z"/>
      <rect x="528" y="160" width="22" height="95"/><path d="M526 160 L539 130 L552 160 Z"/>
      <rect x="560" y="180" width="20" height="75"/><path d="M558 180 L570 155 L582 180 Z"/>
      <rect x="590" y="195" width="18" height="60"/><path d="M588 195 L599 172 L610 195 Z"/>
    </g>
    <path d="M402 190 L415 200 M435 195 L448 180 M472 170 L488 150 M514 160 L528 175 M550 185 L560 195 M580 205 L590 210" stroke="#ffe9a8" stroke-width="2" filter="url(#glow)" opacity=".9"/>
  </g>

  <!-- Whisperwood (undiscovered: fogged) -->
  <g opacity=".9">
    <g fill="#1d2b1c">
      <circle cx="150" cy="300" r="26"/><circle cx="185" cy="270" r="22"/><circle cx="200" cy="330" r="28"/>
      <circle cx="140" cy="360" r="24"/><circle cx="230" cy="290" r="20"/><circle cx="175" cy="400" r="26"/>
      <circle cx="225" cy="380" r="22"/><circle cx="120" cy="430" r="20"/>
    </g>
    <ellipse cx="180" cy="350" rx="120" ry="110" fill="#8a94b0" opacity=".28" filter="url(#blur)"/>
  </g>
  <!-- ruins NW: fully hidden -->
  <ellipse cx="200" cy="170" rx="90" ry="50" fill="#8a94b0" opacity=".3" filter="url(#blur)"/>

  <!-- village -->
  <g fill="#5a4636" stroke="#7a5f48">
    <path d="M700 520 l18 -16 l18 16 v22 h-36 Z"/><path d="M745 540 l16 -14 l16 14 v20 h-32 Z"/>
    <path d="M785 505 l20 -18 l20 18 v24 h-40 Z"/><path d="M820 545 l15 -13 l15 13 v19 h-30 Z"/>
  </g>
  <text x="688" y="496" fill="#c9b27a" font-size="13" font-style="italic">the village</text>

  <!-- greenhouses -->
  <g fill="#3d5a4a" stroke="#8fc0a5" stroke-opacity=".6">
    <path d="M700 205 q20 -26 40 0 Z"/><path d="M745 210 q18 -22 36 0 Z"/>
  </g>

  <!-- ============ place markers ============ -->
  <g font-size="13">
    <!-- open, public -->
    <g>
      <circle cx="380" cy="275" r="15" fill="#2c3a5e" stroke="#c8d3f0" stroke-width="2"/>
      <path d="M373 270 h14 v11 h-14 Z M380 270 v11" stroke="#e8edf9" fill="none"/>
      <text x="356" y="306" fill="#e8edf9">Library</text>
    </g>
    <g>
      <circle cx="470" cy="278" r="15" fill="#2c3a5e" stroke="#c8d3f0" stroke-width="2"/>
      <path d="M463 282 h14 M466 274 v8 M474 274 v8" stroke="#e8edf9"/>
      <text x="438" y="309" fill="#e8edf9">Refectory</text>
    </g>

    <!-- CLUB obligation, selected as visit ① -->
    <g>
      <circle cx="660" cy="150" r="20" fill="#e8c45a" opacity=".25" filter="url(#glow)"/>
      <circle cx="660" cy="150" r="15" fill="#5a3a2a" stroke="#e8c45a" stroke-width="3"/>
      <path d="M653 157 l14 -14 M653 143 l14 14" stroke="#ffe9a8" stroke-width="2"/>
      <text x="628" y="122" fill="#f1e3b0">Duel Hall</text>
      <rect x="678" y="136" width="70" height="20" rx="10" fill="#e8c45a"/>
      <text x="686" y="151" fill="#2a1d0e" font-size="12">Practice</text>
      <circle cx="642" cy="134" r="10" fill="#e8c45a"/><text x="638" y="139" fill="#2a1d0e" font-size="12">1</text>
      <!-- NPC present pin: Lyra -->
      <circle cx="676" cy="172" r="9" fill="#b0383c" stroke="#fff" stroke-width="1.5"/><text x="672" y="176" fill="#fff" font-size="10">L</text>
    </g>

    <!-- JOB obligation, overdue -->
    <g>
      <circle cx="800" cy="480" r="15" fill="#4a3424" stroke="#e8875a" stroke-width="3"/>
      <path d="M794 474 h12 v10 q-6 6 -12 0 Z" fill="#ffd2b0"/>
      <text x="772" y="455" fill="#f6d2c0">Gilded Newt</text>
      <rect x="818" y="472" width="98" height="20" rx="10" fill="#e8875a"/>
      <text x="826" y="487" fill="#2a1408" font-size="12">Shift · 1 left</text>
    </g>

    <!-- discovered but closed at this time -->
    <g opacity=".5">
      <circle cx="740" cy="235" r="15" fill="#22302a" stroke="#8fc0a5" stroke-width="2"/>
      <path d="M740 243 v-12 M734 235 q6 -8 12 0" stroke="#cfe8d8" fill="none"/>
      <text x="706" y="266" fill="#cfe8d8">Greenhouses</text>
      <text x="706" y="281" fill="#cfe8d8" font-size="11" font-style="italic">opens mornings</text>
    </g>

    <!-- hinted, not yet discovered -->
    <g>
      <circle cx="501" cy="70" r="14" fill="#1a2238" stroke="#9aa6c4" stroke-width="2" stroke-dasharray="3 3"/>
      <text x="496" y="75" fill="#c8d3f0" font-size="15">?</text>
      <text x="522" y="74" fill="#9aa6c4" font-size="12" font-style="italic">a locked stair…</text>
    </g>
    <g>
      <circle cx="185" cy="340" r="14" fill="#1a2238" stroke="#9aa6c4" stroke-width="2" stroke-dasharray="3 3"/>
      <text x="180" y="345" fill="#c8d3f0" font-size="15">?</text>
    </g>

    <!-- FESTIVAL replaces a visit -->
    <g>
      <circle cx="480" cy="505" r="22" fill="#ffcf6b" opacity=".25" filter="url(#glow)"/>
      <circle cx="480" cy="505" r="15" fill="#3a2e1a" stroke="#ffcf6b" stroke-width="3"/>
      <path d="M475 498 h10 v12 h-10 Z" fill="#ffcf6b"/><path d="M480 494 v4" stroke="#ffcf6b"/>
      <text x="420" y="540" fill="#ffe2a0">Lakeshore · Lantern Night</text>
      <text x="420" y="556" fill="#d9c08a" font-size="11" font-style="italic">festival: takes your evening visit</text>
    </g>

    <!-- open, with unseen content sparkle + NPC pins -->
    <g>
      <circle cx="586" cy="278" r="15" fill="#2c3a5e" stroke="#c8d3f0" stroke-width="2"/>
      <path d="M580 284 l6 -12 l6 12" stroke="#e8edf9" fill="none"/>
      <text x="566" y="309" fill="#e8edf9">Courtyard</text>
      <path d="M604 262 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 Z" fill="#fff6c8"/>
      <circle cx="568" cy="262" r="9" fill="#5c8a3a" stroke="#fff" stroke-width="1.5"/><text x="564" y="266" fill="#fff" font-size="10">T</text>
      <circle cx="552" cy="270" r="9" fill="#7a5ab0" stroke="#fff" stroke-width="1.5"/><text x="548" y="274" fill="#fff" font-size="10">M</text>
    </g>

    <!-- village shop -->
    <g>
      <circle cx="725" cy="565" r="13" fill="#2c3a5e" stroke="#c8d3f0" stroke-width="2"/>
      <path d="M720 566 h10 v5 h-10 Z M722 566 q3 -6 6 0" stroke="#e8edf9" fill="none"/>
      <text x="660" y="585" fill="#e8edf9" font-size="12">Mabel's</text>
    </g>
  </g>

  <!-- legend -->
  <g font-size="12" transform="translate(32 610)">
    <rect x="-12" y="-22" width="900" height="56" rx="10" fill="#0d1222" fill-opacity=".75" stroke="#2c3a5e"/>
    <circle cx="8" cy="0" r="8" fill="#2c3a5e" stroke="#c8d3f0" stroke-width="2"/><text x="22" y="4" fill="#c8d3f0">open</text>
    <circle cx="80" cy="0" r="8" fill="#5a3a2a" stroke="#e8c45a" stroke-width="3"/><text x="94" y="4" fill="#c8d3f0">your club / job (badge = what's due)</text>
    <circle cx="320" cy="0" r="8" fill="#22302a" stroke="#8fc0a5" stroke-width="2" opacity=".5"/><text x="334" y="4" fill="#c8d3f0">closed now</text>
    <circle cx="430" cy="0" r="8" fill="#1a2238" stroke="#9aa6c4" stroke-width="2" stroke-dasharray="3 3"/><text x="444" y="4" fill="#c8d3f0">hinted, undiscovered</text>
    <circle cx="590" cy="0" r="8" fill="#3a2e1a" stroke="#ffcf6b" stroke-width="3"/><text x="604" y="4" fill="#c8d3f0">festival</text>
    <circle cx="680" cy="0" r="7" fill="#b0383c" stroke="#fff" stroke-width="1.5"/><text x="694" y="4" fill="#c8d3f0">who's there</text>
    <path d="M790 -6 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 Z" fill="#fff6c8"/><text x="804" y="4" fill="#c8d3f0">something new</text>
    <text x="8" y="24" fill="#6f7a96" font-size="11" font-style="italic">Fog hides places you haven't found. Season tints the map (autumn shown). Tap twice: first pick = afternoon, second = evening.</text>
  </g>
</svg>
